name: Highlights do dia
# Rodízio diário de setor: seg cimento · ter aço · qua celulose · qui agro · sex alimentos · sáb saúde · dom combustíveis.
on:
  schedule:
    - cron: "17 8 * * *"    # 05h17 (Brasília)
    - cron: "47 14 * * *"   # 11h47 (Brasília) — atualiza as manchetes no meio do dia
  push:
    branches: [main]
    paths: ["scripts/highlights.mjs"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: highlights
  cancel-in-progress: false
jobs:
  busca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/highlights.mjs
      - run: |
          git config user.name "Farol Operacional (automático)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/highlights.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Highlights do dia $(TZ=America/Sao_Paulo date +%d/%m)"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done; exit 1
