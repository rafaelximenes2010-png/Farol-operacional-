name: Agenda de avisos
# Envia, no horário marcado, os avisos de data/agenda-avisos.json: grava cada um em data/aviso.json
# (uma única vez, registrado em data/agenda-enviados.txt). O Worker farol-push lê aviso.json a cada
# 5 minutos e manda a notificação para todos os aparelhos inscritos, inclusive com a tela bloqueada.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aviso-edicao
jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gravar aviso vencido
        run: |
          python3 - <<'PY'
          import json, datetime, os
          ag = json.load(open("data/agenda-avisos.json", encoding="utf-8"))["avisos"]
          feitos = set(open("data/agenda-enviados.txt").read().split()) if os.path.exists("data/agenda-enviados.txt") else set()
          agora = datetime.datetime.now(datetime.timezone.utc)
          dev = [a for a in ag if a["id"] not in feitos and datetime.datetime.fromisoformat(a["em"]) <= agora and agora - datetime.datetime.fromisoformat(a["em"]) < datetime.timedelta(hours=2)]
          velhos = [a["id"] for a in ag if a["id"] not in feitos and agora - datetime.datetime.fromisoformat(a["em"]) >= datetime.timedelta(hours=2)]
          if not dev and not velhos: print("nada a enviar"); raise SystemExit
          with open("data/agenda-enviados.txt", "a") as f:
            for i in velhos: f.write(i + "\n")
            if dev:
              a = max(dev, key=lambda x: x["em"])
              for x in dev: f.write(x["id"] + "\n")
              ate = (datetime.datetime.fromisoformat(a["em"]) + datetime.timedelta(hours=6)).isoformat()
              json.dump({"id": a["id"], "titulo": a["titulo"], "texto": a["texto"], "ate": ate}, open("data/aviso.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
              print("aviso:", a["id"])
          PY
      - name: Publicar
        run: |
          git config user.name "farol-bot"; git config user.email "farol-bot@users.noreply.github.com"
          git add data/aviso.json data/agenda-enviados.txt
          git diff --cached --quiet && exit 0
          git commit -m "Aviso agendado"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
