name: Mercado diário
on:
  schedule:
    - cron: "17 10 * * 1-5"   # 07h17 (Brasília)
    - cron: "47 15 * * 1-5"   # 12h47 (Brasília), após a PTAX do dia
    - cron: "23 21 * * 1-5"   # 18h23 (Brasília), fechamento
  workflow_dispatch:
permissions:
  contents: write
jobs:
  busca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/mercado.mjs
      - run: |
          git config user.name "Farol Operacional (automático)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mercado.json data/alertas-mercado.json
          git diff --cached --quiet || (git commit -m "Mercado: busca automática $(date -u +%F' '%H:%M) UTC" && git push)
