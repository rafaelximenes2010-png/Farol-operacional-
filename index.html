const mi=v=>v==null?"—":"R$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mi";
const pct=(v,d=0)=>v==null?"—":v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
const sg=v=>(v>=0?"+":"−")+brl(Math.abs(v)).replace("R$ ","R$ ");
const cor=p=>p>=100?"g":p>=90?"y":"r";
const st=p=>p>=100?"Acima da meta":p>=90?"Próximo da meta":"Em atenção";

function normRegs(X){if(!X)return;const n=x=>{x=String(x||"").trim().toUpperCase().replace(/\s+/g," ");return x==="NORDESTE"?"NORDESTE 1":x;};(X.reg||[]).forEach(r=>r[0]=n(r[0]));(X.farol||[]).forEach(f=>f[0]=n(f[0]));}
function mergeFarol(Dx,R){if(!R||!R.farol||!R.farol.length)return;normRegs(Dx);normRegs(R);R.farol.forEach(([n,p])=>{const f=Dx.farol.find(x=>x[0]===n);if(f){f[1]=p;f.length=2;}else Dx.farol.push([n,p]);});}
/* editorial herdado de outra edição (dia carregado só com os PDFs do BI): refaz com os números do dia */

const DDS_BANCO=[
["Cinto de segurança, sempre!","O cinto salva vidas em qualquer trajeto, curto ou longo. Antes de dar a partida, confira se você e todos no veículo estão com o cinto bem ajustado. Não existe viagem rápida demais para usar o cinto."],
["Cansaço também é risco","Dirigir com sono é tão perigoso quanto dirigir alcoolizado. Respeite as pausas e o descanso obrigatório. Sentiu os olhos pesando? Pare em local seguro. Chegar mais tarde é melhor do que não chegar."],
["Checklist antes de sair","Pneus, freios, luzes, retrovisores, nível de óleo e documentação: confira tudo antes de iniciar a viagem. Encontrou algo errado? Não saia, avise o líder. O checklist bem feito evita acidentes e paradas na estrada."],
["Velocidade sob controle","Respeite os limites da via e da empresa. Em descidas, use o freio motor; em curvas, reduza antes de entrar. Velocidade a mais não traz ganho de tempo que compense o risco."],
["Chuva pede mais cuidado","Na pista molhada, a distância de frenagem aumenta muito. Reduza a velocidade, aumente a distância do veículo da frente e acenda os faróis. Com visibilidade ruim, pare em local seguro e espere."],
["EPI é proteção de verdade","Capacete, óculos, luvas, botina e colete não são enfeite: são a última barreira entre você e o acidente. No pátio, na carga e na descarga, use o EPI completo e em bom estado."],
["Carga bem amarrada","Carga solta ou mal distribuída tomba, desloca e provoca acidentes graves. Confira cintas, travas e lona antes de sair e durante as paradas. Respeite o limite de peso por eixo."],

["O que pode ser medido pode ser melhorado.","Peter Drucker"],

 let g="";for(let k=0;k<=4;k++){const v=maxV*k/4;g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pad.l-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--ink2)">${Math.round(v/1e6)} mi</text>`;}
 (opts.labels||[]).forEach(([i,t])=>g+=`<text x="${X(i)}" y="${h-8}" font-size="10" text-anchor="middle" fill="var(--ink2)">${t}</text>`);
 series.forEach(s=>{const p=s.pts.map((v,i)=>v==null?null:[X(i+(s.off||0)),Y(v)]).filter(Boolean);
  if(s.fill) g+=`<path d="M${p[0][0]},${Y(0)} L${p.map(q=>q.join(",")).join(" L")} L${p[p.length-1][0]},${Y(0)}Z" fill="${s.c}" opacity=".10"/>`;
  g+=`<polyline points="${p.map(q=>q.join(",")).join(" ")}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.5}" ${s.dash?'stroke-dasharray="6 5"':""} stroke-linejoin="round"/>`;
  if(s.end){const q=p[p.length-1];g+=`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${s.c}"/>`;}});
 if(opts.mark!=null) g+=`<line x1="${X(opts.mark)}" x2="${X(opts.mark)}" y1="${pad.t}" y2="${h-pad.b}" stroke="var(--ink2)" stroke-dasharray="2 3"/><text x="${X(opts.mark)+4}" y="${pad.t+10}" font-size="10" fill="var(--ink2)">hoje (D-1)</text>`;
 return `<svg class="chart" viewBox="0 0 ${w} ${h}">${g}</svg>`;}
function barsChart(items,w=360,h=190){const big=w>=600,fs=big?12.5:(w<=400&&items.length>14?9.5:8.5),fa=big?13:10;const tw=t=>String(t||"").length*fs*.6;
 const n=items.length,bw0=(w-(big?44:30)-4)/n,rot=items.some(i=>i.t&&tw(i.t)>bw0*.98);const rl=rot?Math.max(...items.map(i=>tw(i.t)))+6:0;
 const maxV=Math.max(...items.flatMap(i=>[i.v||0,i.m||0,i.ghost||0]))*1.08||1;const yl=String(Math.round(maxV/1e6)).length;const pad={l:Math.max(big?36:24,yl*fa*.62+10),r:4,t:(big?24:18)+rl,b:big?30:22};const bw=(w-pad.l-pad.r)/n;
 const Y=v=>h-pad.b-(h-pad.t-pad.b)*v/maxV;let g="";for(let k=0;k<=3;k++){const v=maxV*k/3;g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pad.l-6}" y="${Y(v)+4}" font-size="${fa}" text-anchor="end" fill="var(--ink2)">${Math.round(v/1e6)}</text>`;}
 items.forEach((it,i)=>{const x=pad.l+i*bw+bw*.18,bwi=bw*.64;const gr=it.k!=null||it.dm;if(it.k!=null)g+=`<g class="dd" data-rmm="${it.k}" style="cursor:pointer"><rect x="${pad.l+i*bw}" y="0" width="${bw}" height="${h}" fill="transparent"/>`;else if(it.dm)g+=`<g class="dd" data-m="${it.dm}" style="cursor:pointer"><rect x="${pad.l+i*bw}" y="0" width="${bw}" height="${h}" fill="transparent"/>`;if(it.ghost!=null) g+=`<rect x="${x-bw*.1}" y="${Y(it.ghost)}" width="${bwi}" height="${Y(0)-Y(it.ghost)}" rx="3" fill="var(--line)"/>`;
  if(it.v!=null) g+=`<rect x="${it.ghost!=null?x+bw*.1:x}" y="${Y(it.v)}" width="${bwi}" height="${Y(0)-Y(it.v)}" rx="3" fill="${it.c}"/>`;

  if(it.t){const ty=Y(Math.max(it.v||0,it.m||0))-5,cx=x+bwi/2;g+=rot?`<text transform="translate(${cx+fs*.35} ${ty}) rotate(-90)" font-size="${fs}" font-weight="700" text-anchor="start" fill="${it.c}">${it.t}</text>`:`<text x="${cx}" y="${ty}" font-size="${fs}" font-weight="700" text-anchor="middle" fill="${it.c}">${it.t}</text>`;}
  g+=`<text x="${x+bwi/2}" y="${h-(big?10:8)}" font-size="${fa}" text-anchor="middle" fill="var(--ink2)">${it.l}</text>`;if(gr)g+=`</g>`;});
 return `<svg class="chart" viewBox="0 0 ${w} ${h}">${g}</svg>`;}

/* NOTIFICAÇÃO COM A TELA BLOQUEADA (Web Push): inscreve o aparelho no Worker de notificações (api/push-worker.js).
   O endereço do Worker fica em data/push.json; sem endereço, nada acontece. iPhone: só com o app instalado na tela de início (iOS 16.4+). */
async function pushInscrever(){try{if(!("PushManager" in window)||!("Notification" in window)||Notification.permission!=="granted")return;
 const cfg=await (await fetch("data/push.json?t="+Date.now(),{cache:"no-store"})).json();const W=(cfg&&cfg.worker||"").replace(/\/$/,"");if(!W)return;
 const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
 if(!sub){const k=(await (await fetch(W+"/vapid",{cache:"no-store"})).json()).chave;const raw=Uint8Array.from(atob(k.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((k.length+3)%4)),c=>c.charCodeAt(0));
  sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:raw});}
 const pf=LS.get("farolPerfil",{})||{};const j=JSON.stringify(sub);if(LS.get("farolPushEnv","")===j+W)return;
 const r=await fetch(W+"/inscrever",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sub:sub.toJSON(),nome:pf.nome||"",regional:pf.regional||""})});
 if(r.ok)LS.set("farolPushEnv",j+W);}catch(e){}}

/* ===== SUPER META (5% · 7% · 10%) e REMUNERAÇÃO VARIÁVEL ===== */
const FAIXAS=[["Meta",0],["+5%",5],["+7%",7],["+10%",10]];
const CARGOS=[["Diretoria",[2,.5,.5,1]],["Gerente Nacional",[2,.25,.25,.5]],["Demais Gerentes e Coordenadores",[1,.25,.25,.5]]];
const faixaAting=pc=>pc>=110?3:pc>=107?2:pc>=105?1:pc>=100?0:-1;
function bonusMax(cargo,f){const c=CARGOS.find(x=>x[0]===cargo)[1];return f<0?0:c.slice(0,f+1).reduce((a,b)=>a+b,0);}
const pctEbitda=e=>e<80?0:Math.min(e,120);
function ponteSVG(base,proj,acum,w=360,h=290){const pad={l:34,r:8,t:26,b:40};const lv=FAIXAS.map(f=>base*(1+f[1]/100));const top=Math.max(proj,lv[3])*1.06,bot=base*.86;
 const f1=v=>(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
 const Y=v=>pad.t+(h-pad.t-pad.b)*(1-(v-bot)/(top-bot));const items=[["Meta",bot,base,"#3f6fd8",`<b>Meta orçada do mês: R$ ${f1(base)} mi</b><br>Valor do orçamento para o mês. Abaixo disso não há elegibilidade.`],
  ["+5%",lv[0],lv[1],"#3f6c99",`<b>Super meta +5%: R$ ${f1(lv[1])} mi</b><br>Degrau de R$ ${f1(lv[1]-lv[0])} mi acima da meta.`],["+7%",lv[1],lv[2],"#6f8fd0",`<b>Super meta +7%: R$ ${f1(lv[2])} mi</b><br>Mais R$ ${f1(lv[2]-lv[1])} mi sobre o +5%.`],
  ["+10%",lv[2],lv[3],"#b8862e",`<b>Super meta +10%: R$ ${f1(lv[3])} mi</b><br>Faixa máxima: mais R$ ${f1(lv[3]-lv[2])} mi sobre o +7%.`],
  ["Exced.",lv[3],Math.max(proj,lv[3]),proj>lv[3]?"#1e8e4e":"#9aa3b5",`<b>Excedente: R$ ${f1(Math.max(0,proj-lv[3]))} mi</b><br>Quanto a projeção passa da super meta +10%.`],
  ["Projeção",bot,proj,"#7c5cff",`<b>Projeção conservadora: R$ ${f1(proj)} mi</b><br>Menor das 3 projeções do mês (${pct(proj/base*100,1)} da meta orçada).`]];
 const bw=(w-pad.l-pad.r)/items.length;let g="";
 [bot,base,lv[3],top].forEach(v=>{g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${pad.l-4}" y="${Y(v)+4}" font-size="10" text-anchor="end" style="fill:var(--ink2)">${Math.round(v/1e6)}</text>`;});
 items.forEach((it,i)=>{const x=pad.l+i*bw+bw*.12,ww=bw*.76,y1=Y(it[2]),y0=Y(it[1]);g+=`<rect x="${x}" y="${Math.min(y1,y0)}" width="${ww}" height="${Math.max(3,Math.abs(y0-y1))}" rx="4" fill="${it[3]}" data-tip="${it[4].replace(/"/g,"&quot;")}" style="cursor:pointer"/>`;
  const val=i===0||i===5?f1(it[2]):"+"+((it[2]-it[1])/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1});
  g+=`<text x="${x+ww/2}" y="${Math.min(y1,y0)-6}" font-size="11.5" font-weight="900" text-anchor="middle" style="fill:${i===0||i===5?"var(--ink)":it[3]}">${val}</text><text x="${x+ww/2}" y="${h-pad.b+16}" font-size="10.5" font-weight="600" text-anchor="middle" style="fill:var(--ink2)">${it[0]}</text>`;
  if(i<4) g+=`<line x1="${x+ww}" x2="${x+bw}" y1="${y1}" y2="${y1}" stroke="#9aa3b5" stroke-dasharray="2 2"/>`;});
 if(acum!=null&&acum>bot){g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(acum)}" y2="${Y(acum)}" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${w-pad.r}" y="${Y(acum)-5}" font-size="10.5" font-weight="700" text-anchor="end" fill="#ef4444" data-tip="<b>Realizado até o D-1: R$ ${f1(acum)} mi</b><br>${pct(acum/base*100)} da meta orçada do mês.">realizado ${mi(acum)}</text>`;}
 g+=`<text x="${pad.l}" y="${h-6}" font-size="10" style="fill:var(--ink2)">R$ milhões · toque nas barras para entender</text>`;
 return `<svg class="chart tipchart" viewBox="0 0 ${w} ${h}">${g}</svg><div class="tipbox" hidden></div>`;}
function faixasTabela(base,real,proj,duRest){return `<div class="tw"><table><thead><tr><th>Faixa</th><th>Valor</th><th>Realizado</th><th>Projeção</th>${duRest!=null?"<th>Falta</th><th>Necessário/dia útil</th>":""}</tr></thead><tbody>
 ${FAIXAS.map(f=>{const v=base*(1+f[1]/100),fl=Math.max(0,v-real);return `<tr><td><b>${f[0]==="Meta"?"Meta 100%":"Super meta "+f[0]}</b></td><td>${mi(v)}</td><td><span class="pill ${real>=v?"g":"r"}">${pct(real/v*100)}</span></td><td><span class="pill ${proj>=v?"g":proj>=v*.97?"y":"r"}">${proj>=v?"✓ atinge":pct(proj/v*100)}</span></td>${duRest!=null?`<td>${fl?mi(fl):"✓"}</td><td>${fl?brl(fl/duRest):"—"}</td>`:""}</tr>`;}).join("")}</tbody></table></div>`;}
/* Faixas do ano: mesma tabela nas abas Projeção e Meta — duas bases explícitas: realizado (quanto falta faturar) e projeção (se a projeção alcança) */
function faixasAno(meta,attrs=""){const Y=anoAcum(),A=anoProj(M.proj),mr=Math.max(1,D.orc.length-A.nFech);
 return `<div class="card fx2"${attrs}><div class="fxh"><span></span><span>Realizado até o D-1: <b>${mi(Y.real)}</b></span><span>Projeção do ano: <b>${mi(A.tot)}</b></span></div>${FAIXAS.map(f=>{const v=meta*(1+f[1]/100),ok=A.tot>=v,falt=Math.max(0,v-Y.real),gap=A.tot-v;

/* ===== ATUALIZAÇÃO AUTOMÁTICA DO APP (todos os aparelhos) =====
   A cada 5 min com o app aberto, e sempre que ele volta para a tela, procura versão nova (sw.js).
   Quando acha, a versão nova assume e o app recarrega sozinho assim que estiver livre (sem janela aberta nem digitação). */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
 const swTinha=!!navigator.serviceWorker.controller;let swPend=false;
 const swLivre=()=>!document.querySelector(".sheet")&&!document.getElementById("rvPrint")&&!(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
 let swUlt=Date.now();["pointerdown","keydown","wheel","touchstart","scroll"].forEach(ev=>addEventListener(ev,()=>{swUlt=Date.now();},{passive:true,capture:true}));
 const swRecarregar=()=>{if(!swPend)return;if(document.hidden||(swLivre()&&Date.now()-swUlt>180000)){swPend=false;try{sessionStorage.setItem("farolAtualizado","1");sessionStorage.setItem("farolVolta",JSON.stringify({t:typeof cur!=="undefined"?cur:"hoje",y:scrollY}));}catch(e){}location.reload();}};
 navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{const chk=()=>{if(!document.hidden&&navigator.onLine!==false)reg.update().catch(()=>{});};
  setInterval(chk,5*60*1000);document.addEventListener("visibilitychange",chk);window.addEventListener("online",chk);}).catch(()=>{});
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!swTinha)return;swPend=true;swRecarregar();});
 document.addEventListener("visibilitychange",swRecarregar);setInterval(swRecarregar,15000);
}

/* ===== BACKUP DO APARELHO (automático, cifrado, com restauração) =====
   Guarda uma cópia cifrada (AES-GCM, chave da senha da equipe) de tudo que o Farol salva neste aparelho:
   perfil, ajustes, notificações lidas/apagadas, histórico de edições. Automático a cada 6 h com o app aberto
   (e ao abrir, se a última cópia tiver mais de 6 h). Mantém as 7 mais recentes + cópias de segurança antes de restaurar/sair. */
const BK={db:null,MAX:7,INTERVALO:6*3600e3};
function bkDb(){if(BK.db)return Promise.resolve(BK.db);return new Promise((ok,err)=>{const r=indexedDB.open("farol-backup",1);r.onupgradeneeded=()=>r.result.createObjectStore("snap");r.onsuccess=()=>{BK.db=r.result;ok(BK.db);};r.onerror=()=>err(r.error);});}
async function bkOp(modo,f){const db=await bkDb();return new Promise((ok,err)=>{const t=db.transaction("snap",modo),st=t.objectStore("snap");let res;Promise.resolve(f(st,v=>res=v)).catch(err);t.oncomplete=()=>ok(res);t.onerror=()=>err(t.error);});}
async function bkLista(){return bkOp("readonly",(st,set)=>{const q=st.getAll(),k=st.getAllKeys();let a,b;q.onsuccess=()=>{a=q.result;if(b)set(a.map((x,i)=>Object.assign({chave:b[i]},x.info)));};k.onsuccess=()=>{b=k.result;if(a)set(a.map((x,i)=>Object.assign({chave:b[i]},x.info)));};}).then(l=>(l||[]).sort((x,y)=>y.em-x.em));}
function bkDados(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("farol")&&k!=="farolSenha")o[k]=localStorage.getItem(k);}return o;}
async function bkCriar(motivo="automático"){const senha=LS.get("farolSenha","");if(!senha)return null;const dados=bkDados();if(!Object.keys(dados).length)return null;
 const c=await cifrar(dados,senha),info={em:Date.now(),motivo,chaves:Object.keys(dados).length,tam:c.length,versao:(typeof APP_V!=="undefined"?APP_V:"")};const chave="bk-"+info.em;
 await bkOp("readwrite",st=>{st.put({info,c},chave);});
 const l=await bkLista(),auto=l.filter(x=>x.motivo==="automático"),extra=l.filter(x=>x.motivo!=="automático");
 const fora=[...auto.slice(BK.MAX),...extra.slice(3)];if(fora.length)await bkOp("readwrite",st=>{fora.forEach(x=>st.delete(x.chave));});
 LS.set("farolBkUlt",info.em);return info;}
async function bkLer(chave){return bkOp("readonly",(st,set)=>{const q=st.get(chave);q.onsuccess=()=>set(q.result||null);});}
async function bkAplicar(dados){/* restaura sem apagar a senha; chaves que não existiam no backup ficam como estão */Object.entries(dados).forEach(([k,v])=>{if(k.startsWith("farol")&&k!=="farolSenha"&&typeof v==="string"){try{localStorage.setItem(k,v);}catch(e){}}});}
async function bkRestaurar(c,senha){const dados=await decifrar(c,senha);if(!dados||typeof dados!=="object")throw new Error("Backup inválido.");try{await bkCriar("antes da restauração");}catch(e){}await bkAplicar(dados);if(senha&&!LS.get("farolSenha",""))LS.set("farolSenha",senha);return Object.keys(dados).length;}
async function bkAuto(){try{if(Date.now()-LS.get("farolBkUlt",0)>=BK.INTERVALO)await bkCriar("automático");}catch(e){}}

function idb(){return new Promise((ok,err)=>{const r=indexedDB.open("farol",1);r.onupgradeneeded=()=>r.result.createObjectStore("pdf");r.onsuccess=()=>ok(r.result);r.onerror=()=>err(r.error);});}
async function pdfSalvar(iso,blob){try{const db=await idb();await new Promise(r=>{const t=db.transaction("pdf","readwrite");t.objectStore("pdf").put(blob,iso);t.oncomplete=r;t.onerror=r;});}catch(e){}}
async function pdfLer(iso){try{const db=await idb();return await new Promise(r=>{const q=db.transaction("pdf").objectStore("pdf").get(iso);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});}catch(e){return null;}}
const u8b64=u=>{let s2="";for(let i=0;i<u.length;i+=32768)s2+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s2);};
async function cifrarBytes(u,senha){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await chave(senha,salt),u));return JSON.stringify({v:1,salt:u8b64(salt),iv:u8b64(iv),ct:u8b64(ct)});}
async function decifrarBytes(txt,senha){const j=JSON.parse(txt);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(j.iv)},await chave(senha,ub64(j.salt)),ub64(j.ct)));}

 if(!a||!a.id||!a.titulo)return;if(a.ate&&Date.now()>Date.parse(a.ate))return;const vis=LS.get("farolAvisosVistos",[]);if(vis.includes(a.id))return;

/* histórico completo em todos os aparelhos: baixa do servidor toda edição publicada (últimos 40 dias) que ainda não está no aparelho.
   Dia sem edição no servidor é reconsultado a cada 6 h. Edições têm ~5 KB. */
let _sincHist=false;
async function sincronizarHistorico(){if(_sincHist||!D)return;const senha=LS.get("farolSenha","");if(!senha)return;_sincHist=true;
 try{const ed=edicoes(),fal=LS.get("farolFaltas",{}),agora=Date.now(),ult=Object.keys(ed).sort().pop()||isoOf(d1.data),fim=new Date(ult+"T12:00:00Z");let novos=0;
  for(let i=0;i<=40;i++){const d=new Date(fim);d.setUTCDate(d.getUTCDate()-i);const k=d.toISOString().slice(0,10);if(ed[k])continue;if(fal[k]&&agora-fal[k]<6*3600e3)continue;
   try{const r=await fetch("data/edicoes/"+k+".enc?t="+agora,{cache:"no-store"});if(!r.ok){fal[k]=agora;continue;}const X=await decifrar(await r.text(),senha);
    if(X&&X.d1&&isoOf(X.d1.data)===k){X.meta=Object.assign(X.meta||{},{modo:"equipe"});ed[k]=X;novos++;delete fal[k];}}catch(e){}}
  if(novos){const n={};Object.keys(ed).sort().slice(-62).forEach(k=>n[k]=ed[k]);LS.set("farolEdicoes",n);paintHead();}
  LS.set("farolFaltas",fal);}finally{_sincHist=false;}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checarNovaEdicao().then(sincronizarHistorico).then(checarAviso);});setInterval(()=>checarNovaEdicao().then(sincronizarHistorico).then(checarAviso),5*60*1000);

function plataforma(){const u=navigator.userAgent,ipad=/iPad/.test(u)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 if(/FBAN|FBAV|Instagram|WhatsApp|Line\/|LinkedInApp|GSA\//.test(u))return"inapp";
 if(/iPhone|iPod/.test(u))return"iphone";if(ipad)return"ipad";if(/Android/.test(u))return"android";
 if(/Macintosh/.test(u)&&/Safari/.test(u)&&!/Chrome|Chromium|Edg|Firefox/.test(u))return"macsafari";
 if(/Firefox/.test(u))return"firefox";return"desktop";}
function convite(){const inst=matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: window-controls-overlay)").matches||navigator.standalone;if(inst)return;
 const ate=+LS.get("farolConvite",0);if(Date.now()<ate)return;const visitas=+LS.get("farolVisitas",0)+1;LS.set("farolVisitas",visitas);
 const pf=plataforma();let html="",top=false,acao=null;
 const cab=(t,sub)=>`<div class="t"><img src="icons/icone-96.png" alt=""><div><b>${t}</b><small>${sub}</small></div><button class="x" aria-label="Fechar">×</button></div>`;
 if(pf==="iphone"||pf==="ipad"){top=pf==="ipad";
  html=cab("Instale o Farol no "+(pf==="ipad"?"iPad":"iPhone"),"Abre em tela cheia, com Face ID e sem loja")+`<ol>
  <li><i>1</i>Toque em <span class="k">${pf==="ipad"?"⬆︎ Compartilhar":"⋯ ou ⬆︎ Compartilhar"}</span>${pf==="ipad"?" no topo":" na barra do Safari"}</li>
  <li><i>2</i>Escolha <span class="k">＋ Adicionar à Tela de Início</span></li>
  <li><i>3</i>Deixe <span class="k">Abrir como App Web</span> ligado e toque em <b>Adicionar</b></li></ol>
  <div class="bt"><button class="no">Agora não</button></div>`;}
 else if(pf==="inapp"){html=cab("Abra no navegador para instalar","Este link abriu dentro de outro app")+`<ol><li><i>1</i>Toque em <span class="k">⋯</span> no canto da tela</li><li><i>2</i>Escolha <span class="k">Abrir no Safari / Chrome</span></li><li><i>3</i>Lá, instale o Farol na tela inicial</li></ol><div class="bt"><button class="no">Entendi</button></div>`;}
 else if(pf==="macsafari"){html=cab("Instale o Farol no Mac","Fica no Dock, como um app")+`<ol><li><i>1</i>No menu, toque em <span class="k">Arquivo</span></li><li><i>2</i>Escolha <span class="k">Adicionar ao Dock…</span></li></ol><div class="bt"><button class="no">Agora não</button></div>`;}
 else if(pf==="firefox"){html=cab("Use o Chrome ou o Edge para instalar","O Firefox não instala apps da web no computador")+`<div class="bt"><button class="no">Entendi</button></div>`;}
 else if(deferredInstall){html=cab(pf==="android"?"Instalar o Farol no celular":"Instalar o Farol no computador",pf==="android"?"Rápido, sem loja, menos de 1 MB":"Abre em janela própria, no menu Iniciar / Dock")+`<div class="bt"><button class="no">Agora não</button><button class="go">⬇ Instalar</button></div>`;acao=doInstall;}
 else return;
 if(pf!=="inapp"&&visitas<2&&!deferredInstall)return; // só a partir da 2ª visita, para não atrapalhar o primeiro uso
 const d=document.createElement("div");d.className="ipb"+(top?" top":"");d.innerHTML=html;document.body.appendChild(d);
 const fechar=dias=>{d.remove();LS.set("farolConvite",Date.now()+dias*864e5);};

/* ===== BUSCA NO APP (farolzinho no topo) ===== */
const semAc=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const ABA_NOME={hoje:"Hoje",mes:"Mês",reg:"Regionais",proj:"Projeção",orc:"Meta"};
let BUSCA_IX=null,BUSCA_DE=null;
function buscaIndice(){const chave=D?JSON.stringify(D.d1)+(D.meta&&D.meta.atualizado||""):"";if(BUSCA_IX&&BUSCA_DE===chave)return BUSCA_IX;const ix=[];
 if(D){Object.keys(V).forEach(t=>{let h="";try{h=V[t]()+xtraHtml(t);}catch(e){return;}const box=document.createElement("div");box.innerHTML=h;
  box.querySelectorAll("script,style,svg").forEach(x=>x.remove());box.querySelectorAll("*").forEach(x=>x.append(" "));const hs=[...box.querySelectorAll("h2")];
  hs.forEach(h2=>{const tit=(h2.childNodes[0]&&h2.childNodes[0].textContent||h2.textContent).trim();if(!tit)return;let txt="",n=h2.nextElementSibling;while(n&&n.tagName!=="H2"){txt+=" "+n.textContent;n=n.nextElementSibling;}
   ix.push({tipo:"sec",aba:t,tit,txt:txt.replace(/\s+/g," ").trim()});});});
  (D.reg||[]).forEach(r=>ix.push({tipo:"reg",aba:"reg",tit:titReg(r[0]),nome:r[0],txt:"regional operação "+r[0]}));
  if(D.dds)ix.push({tipo:"msg",tit:"Mensagens do dia",txt:"dds segurança "+D.dds.titulo+" "+D.dds.texto+" "+(D.editorial?"editorial mensagem "+D.editorial.texto:"")+" "+(D.frase?"frase para o dia "+D.frase.texto+" "+D.frase.autor:"")});}
 ix.push({tipo:"rev",tit:"Revista do dia",txt:"morning operational news pdf revista completa baixar enviar whatsapp"});
 ix.forEach(x=>{x.n=semAc(x.tit+" "+x.txt);x.nt=semAc(x.tit);});BUSCA_IX=ix;BUSCA_DE=chave;return ix;}
function buscaTrecho(txt,ws){const n=semAc(txt);let i=-1;for(const w of ws){i=n.indexOf(w);if(i>=0)break;}if(i<0)return esc0(txt.slice(0,110))+(txt.length>110?"…":"");
 const a=Math.max(0,i-45),b=Math.min(txt.length,i+75);let t=esc0(txt.slice(a,b));ws.forEach(w=>{if(w.length<2)return;t=t.replace(new RegExp("("+[...w].map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("[\\u0300-\\u036f]?")+")","gi"),m=>"<mark>"+m+"</mark>");});return (a?"…":"")+t+(b<txt.length?"…":"");}
const esc0=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function buscar(q){const ws=semAc(q).split(/\s+/).filter(Boolean);if(!ws.length)return [];
 return buscaIndice().map(x=>{if(!ws.every(w=>x.n.includes(w)))return null;let sc=0;ws.forEach(w=>{if(x.nt.includes(w))sc+=5;if(x.nt.startsWith(w))sc+=3;});if(x.tipo==="reg")sc+=2;return Object.assign({sc},x);}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,25);}
function buscaIr(x){document.querySelectorAll(".sheet").forEach(s=>s.remove());
 if(x.tipo==="msg"){msgSheet();return;}if(x.tipo==="rev"){FarolPacote.gerarRevista();return;}if(x.tipo==="reg"){if(cur!=="reg")show("reg");regSheet(x.nome);return;}
 if(cur!==x.aba)show(x.aba);setTimeout(()=>{const h=[...document.querySelectorAll("#main h2")].find(h=>((h.childNodes[0]&&h.childNodes[0].textContent)||"").trim()===x.tit);if(!h)return;const alvo=h.closest(".blk")||h;
  alvo.scrollIntoView({behavior:"smooth",block:"start"});alvo.classList.add("achado");setTimeout(()=>alvo.classList.remove("achado"),2200);},120);}
function abrirBusca(){openSheet(`<div class="sh"><b>🔎 Buscar no Farol</b><button id="xS">×</button></div>
 <input id="bqIn" class="bq" type="search" placeholder="Seção, regional, indicador ou palavra…" autocomplete="off" autocapitalize="off" spellcheck="false">
 <div class="bqchips" id="bqCh">${["Farol do dia","Onde agir","Projeção","Ritmo","Margem","Super meta","DDS","Nordeste","Meta","Revista"].map(c=>`<button type="button">${c}</button>`).join("")}</div><div class="bqr" id="bqR"></div>`);
 const inp=$("#bqIn"),out=$("#bqR");let res=[];
 const pinta=()=>{const q=inp.value.trim();$("#bqCh").style.display=q?"none":"flex";if(!q){out.innerHTML=D?"":`<p class="note">Carregue uma edição para buscar nos indicadores.</p>`;return;}
  res=buscar(q);const ws=semAc(q).split(/\s+/).filter(Boolean);
  out.innerHTML=res.length?res.map((x,i)=>`<button type="button" class="bqi" data-i="${i}"><small>${x.tipo==="reg"?"Regional":x.tipo==="msg"?"Mensagens":x.tipo==="rev"?"Revista":ABA_NOME[x.aba]}</small><b>${esc0(x.tit)}</b><span>${buscaTrecho(x.tipo==="sec"?x.txt:x.txt.replace(/^regional operação /,""),ws)}</span></button>`).join(""):`<p class="note">Nada encontrado para “${esc0(q)}”.</p>`;};
 inp.addEventListener("input",pinta);inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&res[0]){e.preventDefault();buscaIr(res[0]);}});
 out.addEventListener("click",e=>{const b=e.target.closest(".bqi");if(b)buscaIr(res[+b.dataset.i]);});
 $("#bqCh").addEventListener("click",e=>{const b=e.target.closest("button");if(b){inp.value=b.textContent;pinta();}});
 setTimeout(()=>inp.focus(),60);pinta();}
$("#bBusca").onclick=abrirBusca;
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();abrirBusca();}});
